<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>📍おでログ Ver.2.0</title>

<style>

body{
    font-family:sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    font-size:36px;
}

button{
    width:100%;
    font-size:24px;
    padding:18px;
    margin:10px 0;
    border:none;
    border-radius:15px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

#recordBtn{
    background:#4CAF50;
    color:white;
}

#locationBtn{
    background:#2196F3;
    color:white;
}

#refreshBtn{
    background:#FF9800;
    color:white;
}

#txtBtn{
    background:#9C27B0;
    color:white;
}

#status{
    text-align:center;
    font-size:22px;
    color:green;
    margin:15px;
}

#currentLocation,
#history{
    background:white;
    padding:15px;
    border-radius:15px;
    margin-top:20px;
}

.record{
    border-bottom:1px solid #ddd;
    padding:14px 0;
    font-size:19px;
    line-height:1.7;
}

.station{
    font-size:24px;
    font-weight:bold;
}

.pageButtons{
    display:flex;
    gap:10px;
}

.pageButtons button{
    font-size:20px;
}

.small{
    color:#666;
    font-size:16px;
}

</style>

</head>


<body>

<h1>📍おでログ</h1>


<button id="recordBtn">
📍 現在地を記録
</button>


<button id="locationBtn">
🏠 現在地を見る
</button>


<button id="refreshBtn">
🔄 更新
</button>


<div id="status">
待機中
</div>


<div id="currentLocation">

<h2>📍 現在地</h2>

<p id="place">
場所：未取得
</p>

<p id="station">
駅：未取得
</p>

<p id="nowTime">
時間：未取得
</p>

<p id="coordinates">
GPS：未取得
</p>

</div>


<div id="history">

<h2>📋 記録</h2>

<div id="list">
まだ記録はありません
</div>

</div>


<div class="pageButtons">

<button id="prevBtn">
◀ 前へ
</button>

<button id="nextBtn">
次へ ▶
</button>

</div>


<button id="txtBtn">
💾 今日の記録をTXT保存
</button>



<script>


/* ========================================
   データ読み込み
======================================== */

let records =
JSON.parse(
    localStorage.getItem("odeLogRecords")
) || [];

let page = 0;

const perPage = 5;


/* ========================================
   HTML要素
======================================== */

const status =
document.getElementById("status");

const list =
document.getElementById("list");

const placeText =
document.getElementById("place");

const stationText =
document.getElementById("station");

const timeText =
document.getElementById("nowTime");

const coordinatesText =
document.getElementById("coordinates");


/* ========================================
   地名取得
======================================== */

async function getPlaceName(lat, lon){

    try{

        const url =
        "https://nominatim.openstreetmap.org/reverse" +
        "?format=json" +
        "&lat=" + lat +
        "&lon=" + lon +
        "&accept-language=ja";

        const res =
        await fetch(url);

        const data =
        await res.json();

        const address =
        data.address || {};

        return (
            address.city ||
            address.town ||
            address.village ||
            address.municipality ||
            address.county ||
            "場所不明"
        );

    }catch(e){

        return "地名取得失敗";

    }

}


/* ========================================
   近くの駅を取得
======================================== */

async function getNearestStation(lat, lon){

    try{

        const query = `
[out:json][timeout:10];

(
  node
    ["railway"="station"]
    (around:1500,${lat},${lon});

  way
    ["railway"="station"]
    (around:1500,${lat},${lon});
);

out center tags;
`;

        const response =
        await fetch(
            "https://overpass-api.de/api/interpreter",
            {
                method:"POST",
                body:query
            }
        );

        const data =
        await response.json();

        if(
            !data.elements ||
            data.elements.length === 0
        ){

            return "駅情報なし";

        }


        let nearest = null;
        let nearestDistance = Infinity;


        data.elements.forEach(function(element){

            let stationLat =
            element.lat ??
            element.center?.lat;

            let stationLon =
            element.lon ??
            element.center?.lon;


            if(
                stationLat === undefined ||
                stationLon === undefined
            ){
                return;
            }


            let distance =
            getDistance(
                lat,
                lon,
                stationLat,
                stationLon
            );


            if(distance < nearestDistance){

                nearestDistance = distance;

                nearest = {
                    name:
                    element.tags?.name ||
                    "名称不明",

                    distance:distance
                };

            }

        });


        if(!nearest){

            return "駅情報なし";

        }


        return (
            nearest.name +
            "（約" +
            Math.round(nearest.distance) +
            "m）"
        );


    }catch(e){

        return "駅情報取得失敗";

    }

}


/* ========================================
   2地点間の距離
======================================== */

function getDistance(
    lat1,
    lon1,
    lat2,
    lon2
){

    const R = 6371000;

    const rad =
    Math.PI / 180;

    const dLat =
    (lat2-lat1) * rad;

    const dLon =
    (lon2-lon1) * rad;

    const a =
    Math.sin(dLat/2) *
    Math.sin(dLat/2) +

    Math.cos(lat1*rad) *
    Math.cos(lat2*rad) *

    Math.sin(dLon/2) *
    Math.sin(dLon/2);

    const c =
    2 *
    Math.atan2(
        Math.sqrt(a),
        Math.sqrt(1-a)
    );

    return R*c;

}


/* ========================================
   GPS取得
======================================== */

function getGPS(){

    return new Promise(
        function(resolve,reject){

            if(!navigator.geolocation){

                reject(
                    new Error(
                        "この端末はGPSに対応していません"
                    )
                );

                return;
            }


            navigator.geolocation.getCurrentPosition(

                resolve,

                reject,

                {
                    enableHighAccuracy:true,
                    timeout:20000,
                    maximumAge:0
                }

            );

        }
    );

}


/* ========================================
   現在地を取得
======================================== */

async function getCurrentLocation(
    saveData
){

    status.innerHTML =
    "📡 GPSから現在地を取得中...";


    try{

        const position =
        await getGPS();


        const lat =
        position.coords.latitude;

        const lon =
        position.coords.longitude;


        status.innerHTML =
        "🌍 地名を調べています...";


        const place =
        await getPlaceName(
            lat,
            lon
        );


        status.innerHTML =
        "🚉 近くの駅を調べています...";


        const station =
        await getNearestStation(
            lat,
            lon
        );


        const now =
        new Date();


        const time =
        now.toLocaleString(
            "ja-JP",
            {
                year:"numeric",
                month:"2-digit",
                day:"2-digit",
                hour:"2-digit",
                minute:"2-digit",
                second:"2-digit"
            }
        );


        const date =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            now.getDate()
        ).padStart(2,"0");


        const data = {

            place:place,

            station:station,

            time:time,

            date:date,

            latitude:lat,

            longitude:lon

        };


        /* ================================
           画面表示
        ================================= */

        placeText.innerHTML =
        "場所：" + place;

        stationText.innerHTML =
        "駅：" + station;

        timeText.innerHTML =
        "時間：" + time;

        coordinatesText.innerHTML =
        "GPS：" +
        lat.toFixed(6) +
        " / " +
        lon.toFixed(6);


        /* ================================
           保存する場合
        ================================= */

        if(saveData){

            records.unshift(data);


            localStorage.setItem(
                "odeLogRecords",
                JSON.stringify(records)
            );


            page=0;

            showRecords();


            status.innerHTML =
            "✅ 現在地を記録しました";

        }else{

            status.innerHTML =
            "📍 現在地を表示しました";

        }


    }catch(error){

        console.log(error);

        status.innerHTML =
        "❌ GPS・位置情報の取得に失敗しました";

    }

}


/* ========================================
   「現在地を記録」
======================================== */

document
.getElementById("recordBtn")
.onclick=function(){

    getCurrentLocation(true);

};


/* ========================================
   「現在地を見る」
   ※保存しない
======================================== */

document
.getElementById("locationBtn")
.onclick=function(){

    getCurrentLocation(false);

};


/* ========================================
   履歴表示
======================================== */

function showRecords(){

    list.innerHTML="";


    const start =
    page * perPage;


    const show =
    records.slice(
        start,
        start + perPage
    );


    if(show.length===0){

        list.innerHTML =
        "まだ記録はありません";

        return;

    }


    show.forEach(function(r){

        const div =
        document.createElement("div");


        div.className="record";


        div.innerHTML =

        "<div class='station'>" +
        "🚉 " +
        escapeHTML(r.station) +
        "</div>" +

        "📍 " +
        escapeHTML(r.place) +

        "<br>🕒 " +
        escapeHTML(r.time) +

        "<br>" +

        "<span class='small'>" +
        "GPS：" +
        Number(r.latitude).toFixed(6) +
        " / " +
        Number(r.longitude).toFixed(6) +
        "</span>";


        list.appendChild(div);

    });

}


/* ========================================
   HTML安全化
======================================== */

function escapeHTML(text){

    if(text === undefined ||
       text === null){

        return "";

    }


    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ========================================
   更新
======================================== */

document
.getElementById("refreshBtn")
.onclick=function(){

    records =
    JSON.parse(
        localStorage.getItem(
            "odeLogRecords"
        )
    ) || [];


    page=0;

    showRecords();

    status.innerHTML =
    "🔄 更新しました";

};


/* ========================================
   前へ
======================================== */

document
.getElementById("prevBtn")
.onclick=function(){

    if(page > 0){

        page--;

        showRecords();

    }

};


/* ========================================
   次へ
======================================== */

document
.getElementById("nextBtn")
.onclick=function(){

    if(
        (page+1)*perPage
        <
        records.length
    ){

        page++;

        showRecords();

    }

};


/* ========================================
   今日の記録だけ取り出す
======================================== */

function getTodayRecords(){

    const now =
    new Date();


    const today =
    now.getFullYear() +
    "-" +
    String(
        now.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
        now.getDate()
    ).padStart(2,"0");


    return records.filter(
        function(r){

            return r.date === today;

        }
    );

}


/* ========================================
   TXT内容作成
======================================== */

function makeTXT(){

    const todayRecords =
    getTodayRecords();


    const now =
    new Date();


    const today =
    now.getFullYear() +
    "-" +
    String(
        now.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
        now.getDate()
    ).padStart(2,"0");


    let text =
    "📍 おでログ\n";

    text +=
    "日付：" +
    today +
    "\n";

    text +=
    "================================\n\n";


    if(todayRecords.length===0){

        text +=
        "本日の記録はありません。\n";

        return text;

    }


    todayRecords
    .slice()
    .reverse()
    .forEach(function(r,index){

        text +=
        "【" +
        (index+1) +
        "】\n";

        text +=
        "日時：" +
        r.time +
        "\n";

        text +=
        "場所：" +
        r.place +
        "\n";

        text +=
        "駅：" +
        r.station +
        "\n";

        text +=
        "緯度：" +
        r.latitude +
        "\n";

        text +=
        "経度：" +
        r.longitude +
        "\n";

        text +=
        "--------------------------------\n\n";

    });


    return text;

}


/* ========================================
   TXT保存
======================================== */

document
.getElementById("txtBtn")
.onclick=function(){

    const now =
    new Date();


    const filename =
    now.getFullYear() +
    "-" +
    String(
        now.getMonth()+1
    ).padStart(2,"0") +
    "-" +
    String(
        now.getDate()
    ).padStart(2,"0") +
    "_おでログ.txt";


    const text =
    makeTXT();


    const blob =
    new Blob(
        [text],
        {
            type:"text/plain;charset=utf-8"
        }
    );


    const url =
    URL.createObjectURL(blob);


    const a =
    document.createElement("a");


    a.href=url;

    a.download=filename;

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    URL.revokeObjectURL(url);


    status.innerHTML =
    "💾 今日のTXTを作成しました";

};


/* ========================================
   起動時
======================================== */

showRecords();

</script>


</body>

</html>
