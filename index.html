<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📍おでログ Ver.4.6</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:20px}
h1{text-align:center;font-size:36px}
button{width:100%;font-size:22px;padding:16px;margin:8px 0;border:none;border-radius:15px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#recordBtn{background:#4CAF50;color:white}
#locationBtn{background:#2196F3;color:white}
#autoBtn{background:#9C27B0;color:white}
#refreshBtn{background:#FF9800;color:white}
#voiceBtn{background:#795548;color:white}
#txtBtn{background:#607D8B;color:white}
#status{text-align:center;font-size:20px;color:green;margin:15px}
#currentLocation,#history,#autoInfo{background:white;padding:15px;border-radius:15px;margin-top:20px}
.record{background:#fafafa;border:1px solid #ddd;border-radius:14px;padding:16px;margin:14px 0;font-size:18px;line-height:1.75;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.station{font-size:22px;font-weight:bold;margin-bottom:6px}.recordDate{font-size:16px;color:#666;margin-bottom:6px}.recordPlace{font-size:20px;font-weight:bold;margin:4px 0}.recordTime{font-size:17px;margin:4px 0}.recordMap{font-size:16px;color:#555;margin-top:5px}.recordGap{height:4px}
.pageButtons{display:flex;gap:10px}
.pageButtons button{font-size:20px}
.small{color:#666;font-size:15px}
.note{font-size:15px;color:#666;line-height:1.6}
.transport{font-size:19px;margin:6px 0}.homeInfo{font-size:18px;font-weight:bold;margin:6px 0}
</style>
</head>
<body>

<h1>📍おでログ Ver.4.6</h1>

<button id="recordBtn">📍 現在地を記録</button>
<button id="locationBtn">🏠 現在地を見る（保存しない）</button>
<button id="autoBtn">🤖 自動記録：OFF</button>
<button id="voiceBtn">🔊 音声：OFF</button>
<button id="refreshBtn">🔄 更新</button>

<div id="status">待機中</div>

<div id="autoInfo">
<h2>🤖 自動記録</h2>
<p id="autoState">OFF：自動記録は停止中</p>
<p class="note">ONにすると、ページを開いている間、GPSの位置変化を監視します。前回記録から5分以上経過、または50m以上移動した場合に自動保存します。</p>
</div>

<div id="currentLocation">
<h2>📍 現在地</h2>
<p id="place">場所：未取得</p>
<p id="station">駅：未取得</p>
<p id="nowTime">時間：未取得</p>
<p id="coordinates">GPS：未取得</p>
</div>

<div id="history">
<h2>📋 記録</h2>
<div id="list">まだ記録はありません</div>
</div>

<div class="pageButtons">
<button id="prevBtn">◀ 前へ</button>
<button id="nextBtn">次へ ▶</button>
</div>

<button id="txtBtn">💾 今日の記録をTXT保存</button>
<button id="allTxtBtn">📅 日付ごとのTXTを作成</button>
<div id="fileInfo" class="note">※日付ごとに別ファイルとして作成します。同じ日付のファイルが既にある場合は、iPhone/Safari側で重複名（例：…(1)）になることがあります。</div>

<script>
let records = JSON.parse(localStorage.getItem("odeLogRecords")) || [];
let page = 0;
const perPage = 5;

let autoLogging = false;
let watchId = null;
let lastAutoRecord = null;
let autoSaving = false;
const AUTO_MINUTES = 5;
const AUTO_DISTANCE = 50;

const status = document.getElementById("status");
const list = document.getElementById("list");
const placeText = document.getElementById("place");
const stationText = document.getElementById("station");
const timeText = document.getElementById("nowTime");
const coordinatesText = document.getElementById("coordinates");
const autoBtn = document.getElementById("autoBtn");
const autoState = document.getElementById("autoState");

function saveRecords(){
    localStorage.setItem("odeLogRecords", JSON.stringify(records));
}

function getDistance(lat1,lon1,lat2,lon2){
    const R=6371000, rad=Math.PI/180;
    const dLat=(lat2-lat1)*rad, dLon=(lon2-lon1)*rad;
    const a=Math.sin(dLat/2)**2+
      Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLon/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function getPlaceName(lat,lon){
    try{
        const url="https://nominatim.openstreetmap.org/reverse?format=json&lat="+lat+"&lon="+lon+"&accept-language=ja";
        const res=await fetch(url);
        const data=await res.json();
        const a=data.address||{};
        // 自宅エリア（西郷通）は住所の町名を優先して表示
        if(a.city==="守口市" && (a.suburb==="西郷通" || a.city_district==="西郷通" || a.quarter==="西郷通")) return "西郷通";
        return a.city||a.town||a.village||a.municipality||a.county||"場所不明";
    }catch(e){return "地名取得失敗";}
}

async function getNearestTransport(lat,lon){
    const result={station:"駅情報なし",busStop:"バス停情報なし",stationDistance:Infinity,busStopDistance:Infinity};
    try{
        const query=`[out:json][timeout:15];
(
 node["railway"="station"](around:2500,${lat},${lon});
 way["railway"="station"](around:2500,${lat},${lon});
 node["highway"="bus_stop"](around:2000,${lat},${lon});
 way["highway"="bus_stop"](around:2000,${lat},${lon});
 node["public_transport"="platform"]["bus"](around:2000,${lat},${lon});
 way["public_transport"="platform"]["bus"](around:2000,${lat},${lon});
);
out center tags;`;
        const response=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
        const data=await response.json();
        if(!data.elements) return result;
        data.elements.forEach(el=>{
            const slat=el.lat!==undefined?el.lat:(el.center?el.center.lat:undefined);
            const slon=el.lon!==undefined?el.lon:(el.center?el.center.lon:undefined);
            if(slat===undefined||slon===undefined)return;
            const tags=el.tags||{};
            const name=tags.name||tags["name:ja"]||"名称不明";
            const d=getDistance(lat,lon,slat,slon);
            const isStation=tags.railway==="station";
            const isBus=tags.highway==="bus_stop" || tags.public_transport==="platform" && tags.bus!==undefined;
            if(isStation && d<result.stationDistance){
                result.stationDistance=d;
                result.station=name+"（約"+Math.round(d)+"m）";
            }
            if(isBus && d<result.busStopDistance){
                result.busStopDistance=d;
                result.busStop=name+"（約"+Math.round(d)+"m）";
            }
        });
    }catch(e){
        console.log("交通情報取得エラー:",e);
        result.station="駅情報取得失敗";
        result.busStop="バス停情報取得失敗";
    }
    return result;
}

function getGPSErrorMessage(error){
    if(!error) return "❌ 位置情報の取得に失敗しました";
    switch(error.code){
        case 1:
            return "🔒 位置情報の利用が許可されていません";
        case 2:
            return "📡 現在地を取得できませんでした（GPS・Wi-Fi情報を確認してください）";
        case 3:
            return "⏱️ GPSの取得がタイムアウトしました";
        default:
            return "❌ 位置情報の取得に失敗しました";
    }
}

function getGPS(){
    return new Promise((resolve,reject)=>{
        if(!navigator.geolocation){
            reject(new Error("この端末はGPSに対応していません")); return;
        }

        // まず高精度GPSで取得。iPhone/iPadでは屋内などで時間がかかるため、
        // タイムアウトした場合はWi-Fi等を使う通常精度へ自動的に切り替える。
        navigator.geolocation.getCurrentPosition(
            resolve,
            (error)=>{
                if(error && error.code===3){
                    status.innerHTML="⏱️ 高精度GPSが時間内に取得できませんでした。通常精度で再試行中...";
                    navigator.geolocation.getCurrentPosition(
                        resolve,
                        reject,
                        {
                            enableHighAccuracy:false,
                            timeout:60000,
                            maximumAge:30000
                        }
                    );
                }else{
                    reject(error);
                }
            },
            {
                enableHighAccuracy:true,
                timeout:30000,
                maximumAge:0
            }
        );
    });
}

const HOME_LAT=34.730684;
const HOME_LON=135.572511;
function homeDistance(lat,lon){return getDistance(HOME_LAT,HOME_LON,lat,lon);}
function formatDistance(m){
    if(m<1000)return "約"+Math.round(m)+"m";
    return "約"+(m/1000).toFixed(2)+"km";
}
function formatMinutes(m){return "約"+Math.max(1,Math.round(m/70))+"分";}

function makeData(position,place,transport){
    const now=new Date();
    const time=now.toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});
    const date=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    const lat=position.coords.latitude, lon=position.coords.longitude;
    const hd=homeDistance(lat,lon);
    return {place:place,station:transport.station,busStop:transport.busStop,time:time,date:date,
        latitude:lat,longitude:lon,homeDistance:hd,homeMinutes:Math.max(1,Math.round(hd/70)),
        stationDistance:transport.stationDistance,busStopDistance:transport.busStopDistance};
}

function displayData(data){
    placeText.innerHTML="🏠 自宅";
    stationText.innerHTML="🚉 最寄り駅："+escapeHTML(data.station||"駅情報なし")+"<br>🚌 最寄りバス停："+escapeHTML(data.busStop||"バス停情報なし");
    timeText.innerHTML="時間："+escapeHTML(data.time);
    coordinatesText.innerHTML="🗺️ 地図上の位置："+Number(data.latitude).toFixed(6)+" / "+Number(data.longitude).toFixed(6)+
      "<br>🏠 自宅から："+formatDistance(data.homeDistance)+"　⏱️ 徒歩"+formatMinutes(data.homeMinutes*70);
}

function speak(text){
    if(!voiceEnabled || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";
    u.rate=1.0;
    u.pitch=1.0;
    window.speechSynthesis.speak(u);
}

function toggleVoice(){
    if(!("speechSynthesis" in window)){
        status.innerHTML="❌ この端末では音声読み上げに対応していません";
        return;
    }
    voiceEnabled=!voiceEnabled;
    voiceBtn.innerHTML=voiceEnabled ? "🔊 音声：ON（停止する）" : "🔇 音声：OFF";
    status.innerHTML=voiceEnabled ? "🔊 音声読み上げをONにしました" : "🔇 音声読み上げをOFFにしました";
    if(voiceEnabled) speak("おでログの音声案内を開始しました");
}

function movementMessage(data){
    const sd=Number(data.stationDistance), bd=Number(data.busStopDistance);
    if(data.station && data.busStop && isFinite(sd) && isFinite(bd)){
        if(bd<sd)return "最寄りの交通機関はバス停、"+data.busStop+"です。";
        return "最寄りの交通機関は駅、"+data.station+"です。";
    }
    if(data.busStop && data.busStop!=="バス停情報なし" && data.busStop!=="バス停情報取得失敗") return "最寄りのバス停は"+data.busStop+"です。";
    if(data.station && data.station!=="駅情報なし" && data.station!=="駅情報取得失敗") return "最寄りの駅は"+data.station+"です。";
    return "交通情報を取得できませんでした。";
}

async function recordPosition(position, reason){
    const lat=position.coords.latitude, lon=position.coords.longitude;
    let place="地名取得失敗", transport={station:"駅情報取得失敗",busStop:"バス停情報取得失敗",stationDistance:Infinity,busStopDistance:Infinity};
    status.innerHTML=reason+" 🌍 地名を調べています...";
    try{place=await getPlaceName(lat,lon);}catch(e){}
    status.innerHTML=reason+" 🚉 最寄り駅・バス停を取得中...";
    try{transport=await getNearestTransport(lat,lon);}catch(e){}
    const data=makeData(position,place,transport);
    records.unshift(data); saveRecords(); lastAutoRecord={lat:lat,lon:lon,time:Date.now()}; page=0;
    displayData(data); showRecords();
    status.innerHTML="✅ "+reason+"しました";
    speak(reason+"しました。"+movementMessage(data));
}

async function getCurrentLocation(saveData){
    status.innerHTML="📡 GPSから現在地を取得中...";
    try{
        const position=await getGPS();
        const lat=position.coords.latitude, lon=position.coords.longitude;
        let place="地名取得失敗", transport={station:"駅情報取得失敗",busStop:"バス停情報取得失敗",stationDistance:Infinity,busStopDistance:Infinity};
        status.innerHTML="🌍 地名を調べています...";
        try{place=await getPlaceName(lat,lon);}catch(e){}
        status.innerHTML="🚉 最寄り駅・バス停取得中...";
        try{transport=await getNearestTransport(lat,lon);}catch(e){}
        const data=makeData(position,place,transport);
        displayData(data);
        if(saveData){
            records.unshift(data); saveRecords(); page=0; showRecords();
            status.innerHTML="📍 現在地を記録しました";
            speak("現在地を記録しました。"+movementMessage(data));
        }else{
            status.innerHTML="📍 現在地を表示しました";
            speak("現在地を表示しました。"+movementMessage(data));
        }
    }catch(e){console.log(e);}
}

async function handleAutoPosition(position){
    if(!autoLogging || autoSaving)return;
    const lat=position.coords.latitude, lon=position.coords.longitude;
    if(!lastAutoRecord){
        autoSaving=true;
        try{ await recordPosition(position,"🤖 自動記録"); }
        finally{ autoSaving=false; }
        return;
    }
    const distance=getDistance(lastAutoRecord.lat,lastAutoRecord.lon,lat,lon);
    const minutes=(Date.now()-lastAutoRecord.time)/60000;
    if(distance>=AUTO_DISTANCE || minutes>=AUTO_MINUTES){
        autoSaving=true;
        try{ await recordPosition(position,"🤖 自動記録"); }
        finally{ autoSaving=false; }
    }else{
        status.innerHTML="🤖 自動監視中（約"+Math.round(distance)+"m移動）";
    }
}

function startAutoLogging(){
    if(!navigator.geolocation){
        status.innerHTML="❌ この端末はGPSに対応していません";
        return;
    }
    autoLogging=true;
    autoBtn.innerHTML="🛑 自動記録：ON（停止する）";
    autoState.innerHTML="ON：ページを開いている間、自動記録を監視中";
    status.innerHTML="🤖 自動記録を開始しました";
    watchId=navigator.geolocation.watchPosition(handleAutoPosition,
        (e)=>{status.innerHTML="🤖 "+getGPSErrorMessage(e);},
        {enableHighAccuracy:true,timeout:30000,maximumAge:60000});
}

function stopAutoLogging(){
    autoLogging=false;
    if(watchId!==null){
        navigator.geolocation.clearWatch(watchId);
        watchId=null;
    }
    autoBtn.innerHTML="🤖 自動記録：OFF";
    autoState.innerHTML="OFF：自動記録は停止中";
    status.innerHTML="⏸️ 自動記録を停止しました";
}

document.getElementById("recordBtn").onclick=()=>getCurrentLocation(true);
document.getElementById("locationBtn").onclick=()=>getCurrentLocation(false);
autoBtn.onclick=()=>autoLogging?stopAutoLogging():startAutoLogging();
voiceBtn.onclick=toggleVoice;

function escapeHTML(text){
    if(text===undefined||text===null)return "";
    return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function showRecords(){
    list.innerHTML="";
    const show=records.slice(page*perPage,page*perPage+perPage);
    if(!show.length){list.innerHTML="まだ記録はありません";return;}
    show.forEach(r=>{
        const div=document.createElement("div"); div.className="record";
        const hd=Number(r.homeDistance);
        div.innerHTML="<div class='recordDate'>📅 "+escapeHTML(r.date)+"</div>"+
          "<div class='recordPlace'>🏠 自宅</div>"+
          "<div class='homeInfo'>🏠 自宅から："+(isFinite(hd)?formatDistance(hd):"不明")+"　⏱️ 徒歩"+(isFinite(hd)?formatMinutes(hd):"不明")+"</div>"+
          "<div class='station'>🚉 "+escapeHTML(r.station||"駅情報なし")+"</div>"+
          "<div class='transport'>🚌 "+escapeHTML(r.busStop||"バス停情報なし")+"</div>"+
          "<div class='recordTime'>🕒 "+escapeHTML(r.time)+"</div>"+
          "<div class='recordMap'>🗺️ 地図上の位置："+Number(r.latitude).toFixed(6)+" / "+Number(r.longitude).toFixed(6)+"</div>";
        list.appendChild(div);
    });
}

document.getElementById("refreshBtn").onclick=()=>{
    records=JSON.parse(localStorage.getItem("odeLogRecords"))||[];
    page=0; showRecords(); status.innerHTML="🔄 更新しました";
};
document.getElementById("prevBtn").onclick=()=>{if(page>0){page--;showRecords();}};
document.getElementById("nextBtn").onclick=()=>{if((page+1)*perPage<records.length){page++;showRecords();}};

function getTodayRecords(){
    const now=new Date();
    const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    return records.filter(r=>r.date===today);
}

function makeTXT(){
    const todayRecords=getTodayRecords();
    const now=new Date();
    const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    let text="📍 おでログ Ver.4.6\n日付："+today+"\n================================\n\n";
    if(!todayRecords.length)return text+"本日の記録はありません。\n";
    todayRecords.slice().reverse().forEach((r,index)=>{
        const hd=Number(r.homeDistance);
        text+="【"+(index+1)+"】\n日時："+r.time+"\n場所：🏠 自宅\n";
        text+="自宅から："+(isFinite(hd)?formatDistance(hd):"不明")+"\n";
        text+="徒歩：約"+(isFinite(hd)?Math.max(1,Math.round(hd/70)):"不明")+"分\n";
        text+="最寄り駅："+(r.station||"駅情報なし")+"\n最寄りバス停："+(r.busStop||"バス停情報なし")+"\n";
        text+="🗺️ 地図上の位置\n緯度："+r.latitude+"\n経度："+r.longitude+"\n--------------------------------\n\n";
    });
    return text;
}

function downloadTXT(date){
    const dayRecords=records.filter(r=>r.date===date);
    let text="📍 おでログ Ver.4.6\n日付："+date+"\n================================\n\n";
    if(!dayRecords.length)text+="この日の記録はありません。\n";
    else dayRecords.slice().reverse().forEach((r,index)=>{
        const hd=Number(r.homeDistance);
        text+="【"+(index+1)+"】\n日時："+r.time+"\n場所：🏠 自宅\n";
        text+="自宅から："+(isFinite(hd)?formatDistance(hd):"不明")+"\n";
        text+="徒歩：約"+(isFinite(hd)?Math.max(1,Math.round(hd/70)):"不明")+"分\n";
        text+="最寄り駅："+(r.station||"駅情報なし")+"\n最寄りバス停："+(r.busStop||"バス停情報なし")+"\n";
        text+="🗺️ 地図上の位置\n緯度："+r.latitude+"\n経度："+r.longitude+"\n--------------------------------\n\n";
    });
    const filename=date+"_おでログ.txt";
    const blob=new Blob([text],{type:"text/plain;charset=utf-8"});
    const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
    status.innerHTML="💾 "+filename+" を作成しました";
}

document.getElementById("txtBtn").onclick=()=>{
    const now=new Date();
    const today=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    downloadTXT(today);
};

document.getElementById("allTxtBtn").onclick=()=>{
    const dates=[...new Set(records.map(r=>r.date))].sort().reverse();
    if(!dates.length){
        status.innerHTML="📄 まだTXTにできる記録がありません";
        return;
    }
    dates.forEach((date,index)=>{
        setTimeout(()=>downloadTXT(date), index*700);
    });
    status.innerHTML="💾 "+dates.length+"日分のTXTを作成しました";
};

showRecords();
</script>
</body>
</html>
